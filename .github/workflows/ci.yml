name: CI

on: push

jobs:
 build:
  runs-on: windows-latest
  steps:
  - name: Checkout code
    uses: actions/checkout@v4
  - name: Setup .NET
    uses: actions/setup-dotnet@v4
    with:
     dotnet-version: '10.0.x'
  - name: Build project
    run: |
     dotnet build UrlShortener.Admin/UrlShortener.Admin.csproj
     dotnet build UrlShortener.Api/UrlShortener.Api.csproj
     dotnet build UrlShortener.Contracts/UrlShortener.Contracts.csproj
 test:
  needs: build
  runs-on: windows-latest
  steps: 
   - name: Checkout code
     uses: actions/checkout@v4
   - name: Run tests
     run: dotnet test UrlShortener.Tests/UrlShortener.Tests.csproj
    
     
    
